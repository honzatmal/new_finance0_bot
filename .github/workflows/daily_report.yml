name: Daily Economy Report

on:
  schedule:
    - cron: '30 21 * * *' # 매일 아침 6:30 (KST)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install yfinance python-telegram-bot
      - name: Run script
        env: # ⚠️ 이 부분이 핵심입니다!
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python economy_bot.py
- name: Install dependencies
        run: pip install yfinance python-telegram-bot matplotlib beautifulsoup4 requests
