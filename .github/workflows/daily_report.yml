name: Scheduled Economy Report

on:
  schedule:
    # 한국 시간 기준 (KST = UTC + 9)
    - cron: '2 22 * * *' # KST 07:02 (UTC 22:02 전날)
    - cron: '2 01 * * *' # KST 10:02 (UTC 01:02)
    - cron: '2 03 * * *' # KST 12:02 (UTC 03:02)
    - cron: '2 06 * * *' # KST 15:02 (UTC 06:02)
    - cron: '2 09 * * *' # KST 18:02 (UTC 09:02)
    - cron: '2 12 * * *' # KST 21:02 (UTC 12:02)
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install yfinance python-telegram-bot beautifulsoup4 requests pytz
      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python economy_bot.py
