name: Scheduled Economy Report

on:
  schedule:
    - cron: '30 21 * * *' # KST 06:30 (지표 일정 중심)
    - cron: '30 13 * * *' # KST 22:30 (실적 발표 중심)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install yfinance python-telegram-bot beautifulsoup4 requests pytz
      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python economy_bot.py
