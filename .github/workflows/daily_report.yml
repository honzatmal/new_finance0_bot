name: Hourly Economy Report

on:
  schedule:
    # KST 08:00 ~ 22:00 매 시간 정각 (UTC 23:00 ~ 13:00)
    - cron: '0 23 * * *' # 08:00
    - cron: '0 0 * * *'  # 09:00
    - cron: '0 1 * * *'  # 10:00
    - cron: '0 2 * * *'  # 11:00
    - cron: '0 3 * * *'  # 12:00
    - cron: '0 4 * * *'  # 13:00
    - cron: '0 5 * * *'  # 14:00
    - cron: '0 6 * * *'  # 15:00
    - cron: '0 7 * * *'  # 16:00
    - cron: '0 8 * * *'  # 17:00
    - cron: '0 9 * * *'  # 18:00
    - cron: '0 10 * * *' # 19:00
    - cron: '0 11 * * *' # 20:00
    - cron: '0 12 * * *' # 21:00
    - cron: '0 13 * * *' # 22:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install yfinance python-telegram-bot beautifulsoup4 requests pytz
      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python economy_bot.py
