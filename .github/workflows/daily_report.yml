name: Daily Economy Report

on:
  schedule:
    # GitHub Actions는 UTC 기준이므로 한국 시간(KST)에서 9시간을 뺍니다.
    - cron: '30 21 * * *' # KST 06:30
    - cron: '00 03 * * *' # KST 12:00
    - cron: '00 07 * * *' # KST 16:00
    - cron: '00 12 * * *' # KST 21:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install yfinance python-telegram-bot beautifulsoup4 requests
      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python economy_bot.py
